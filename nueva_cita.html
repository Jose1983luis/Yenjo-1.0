    max-width:650px;

<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark">

<h2 class="titulo-principal text-center">
    <i class="bi bi-calendar2-heart-fill"></i>
    Nueva Cita
</h2>

<p class="subtitulo-principal text-center">
    Agenda tu cita seleccionando el servicio, la profesional y el horario de tu preferencia.
</p>

  <!-- Contenedor principal -->
  <div class="container">

      <div class="card shadow p-4 mx-auto formulario-premium">
          <h3 class="titulo-seccion text-center">
              Agendar una Nueva Cita
          </h3>
          <form>
      <!-- Selección de servicio -->
      <div class="mb-3">
        <label for="servicio" class="form-label fw-semibold">Servicio</label>
        <select id="servicio" class="form-select" required>
          <option value="">Seleccione un servicio</option>
          <option value="manicure">Manicure Spa</option>
          <option value="pedicure">Pedicure Spa</option>
          <option value="cejas">Diseño de Cejas</option>
          <option value="maquillaje">Maquillaje </option>
          <option value="masajes">Masajes Relajantes</option>
        </select>
      </div>

      <!-- Selección de profesional -->
      <div class="mb-3">
        <label for="profesional" class="form-label fw-semibold">Profesional</label>
        <select id="profesional" class="form-select" required>
          <option value="">Seleccione un profesional</option>
          <option value="yennifer">Yennifer Hernández</option>
          <option value="camila">Camila Restrepo</option>
          <option value="laura">Laura Pineda</option>
        </select>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label for="fecha" class="form-label fw-semibold">Fecha</label>
        <input type="date" id="fecha" class="form-control" required>
      </div>

      <!-- Hora -->
      <div class="mb-3">
        <label for="hora" class="form-label fw-semibold">Hora</label>
        <input type="time" id="hora" class="form-control" required>
      </div>

      <!-- Observaciones -->
      <div class="mb-3">
        <label for="observaciones" class="form-label fw-semibold">Observaciones (opcional)</label>
        <textarea id="observaciones" class="form-control" rows="3" placeholder="Ej: Preferencia de color o diseño..."></textarea>
      </div>

      <!-- Botones -->
      <div class="row mt-4 g-3">

          <div class="col-6">
              <a href="citas.html"
                 class="btn btn-outline-secondary w-100">
                  <i class="bi bi-arrow-left me-2"></i>
                  Cancelar
              </a>
          </div>

          <div class="col-6">
              <button
                  type="submit"
                  class="btn btn-primary w-100">

                  <i class="bi bi-check-circle me-2"></i>
                  Guardar Cita

              </button>
          </div>

      </div>
    </form>
  </div>
</div>
