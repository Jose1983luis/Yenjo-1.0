<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>

body {
  background: linear-gradient(
    to bottom,
    #111111 0%,
    #0a0a0a 40%,
    #000000 100%
  );
  color: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  background-color: #111111 !important;
  border-bottom: 1px solid #d4af37;
}

.navbar-brand{
    color: #d4af37 !important;
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-link{
    color: white !important;
    transition: 0.3s;
}

.nav-link:hover{
    color: #d4af37 !important;
}

/* LOGO */
.navbar-brand img{
    border-radius: 50%;
    border: 2px solid #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

/* CARD LOGIN */
.login-card{
    background: #f5f5f5;
    border-radius: 20px;
    padding: 35px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 25px rgba(212,175,55,0.25);
}

.login-card h3{
    color: #5b6b82;
    font-weight: bold;
}

/* INPUTS */
.form-control{
    background-color: #1f1f1f;
    border: 1px solid #d4af37;
    color: white;
}
.form-label{
    color: #d4af37;
    font-weight: 600;
}

.form-control::placeholder{
    color: #9a9a9a;
    opacity: 1;
}

.form-control:focus{
    background-color: #1f1f1f;
    color: white;
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212,175,55,0.4);
}

/* BOTON */
.btn-login{
    background-color: #d4af37;
    color: black;
    font-weight: bold;
    border: none;
    transition: 0.3s;
}

.btn-login:hover{
    background-color: #b8932f;
}

/* LINKS */
.login-links a{
    color: #d4af37;
    text-decoration: none;
}

.login-links a:hover{
    text-decoration: underline;
}

/* FOOTER */
footer{
    color: #d4af37;
}

</style>
</head>
<body>
<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
    <img src="image/Logo Angelina.jpeg" width="75" height="55"
    class="me-2">
    ANGELINA ESTETICA
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container d-flex align-items-center justify-content-center vh-100">

  <div class="login-card">

    <h3 class="text-center mb-4">
      <i class="bi bi-person-circle" style="color: #d4af37;"></i> Iniciar Sesión
    </h3>

    <form>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control"
        id="email"
        placeholder="usuario@correo.com"
        required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control"
        id="password"
        placeholder="********"
        required>
      </div>

      <button type="submit" class="btn btn-login w-100">
        Entrar
      </button>

      <div class="text-center mt-4 login-links">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <br>
        <a href="registro.html">Crear cuenta nueva</a>
      </div>

    </form>

  </div>

</div>
<footer class="text-center mt-4 mb-3">
  <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>
</body>
</html>
