<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>

body {
  background: linear-gradient(
    to bottom,
    #111111 0%,
    #0a0a0a 40%,
    #000000 100%
  );
  color: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  background-color: #111111 !important;
  border-bottom: 1px solid #d4af37;
}

.navbar-brand{
    color: #d4af37 !important;
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-link{
    color: white !important;
    transition: 0.3s;
}

.nav-link:hover{
    color: #d4af37 !important;
}

/* LOGO */
.navbar-brand img{
    border-radius: 50%;
    border: 2px solid #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

/* TITULOS */
h2{
    color: #d4af37;
    font-weight: bold;
}

/* FORMULARIO */
form{
    background: linear-gradient(145deg, #1b1b1b, #2a2a2a) !important;
    border: 1px solid #d4af37;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(212,175,55,0.15);
}

.form-label{
    color: #d4af37;
}

.form-control{
    background-color: #111 !important;
    border: 1px solid #555;
    color: white !important;
}

.form-control::placeholder{
    color: #999;
}

.form-control:focus{
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212,175,55,0.4);
}

/* BOTON */
.btn-primary{
    background-color: #d4af37;
    border: none;
    color: black;
    font-weight: bold;
}

.btn-primary:hover{
    background-color: #b8932f;
    color: black;
}

/* MAPA */
.ratio{
    border: 1px solid #d4af37;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(212,175,55,0.15);
}

/* FOOTER */
footer{
    color: #d4af37 !important;
    background-color: black !important;
}

</style>
</head>
<body>
<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
  <img src="image/Logo Angelina.jpeg" width="75" height="55"
  class="me-2 rounded-circle border border-warning"
  style="border-width: 2px !important; box-shadow: 0 0 15px rgba(212,175,55,0.7);">

  ANGELINA ESTETICA
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>


  <!-- CONTENIDO -->
  <div class="container mt-5">
    <h2 class="text-center mb-4">Contáctanos</h2>
    
    <div class="row">
      <!-- Formulario -->
      <div class="col-md-6">
        <form class="bg-white p-4 shadow-sm rounded">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com">
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
      </div>

      <!-- Mapa -->
      <div class="col-md-6 mt-4 mt-md-0">
        <div class="ratio ratio-16x9 shadow-sm rounded">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3978.033305581962!2d-75.15761174415724!3d4.404869983678603!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e38d007618ce0bf%3A0x62805257a9298f17!2sMirador%20de%20Comfenalco!5e0!3m2!1ses!2sco!4v1760666374515!5m2!1ses!2sco" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>"
      width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 py-3">
    <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
