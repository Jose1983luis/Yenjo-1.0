<h2 class="titulo-principal text-center">
  <i class="bi bi-person-circle"></i>
  Perfil del Usuario
</h2>
  <div class="container">
    <div class="card shadow p-4 mx-auto card-ancho-600">
      <h3 class="titulo-seccion text-center">
  Información Personal
</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" value="Pepito" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" value="Pérez" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" value="pepito@correo.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" value="+57 300 000 0000" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input type="text" class="form-control" value="Calle 123 #45-67" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Modificar</button>
      </form>
    </div>
