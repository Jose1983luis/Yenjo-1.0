  <div class="container contenedor-premium d-flex align-items-center justify-content-center">
  <div class="login-card">
    <h3 class="titulo-seccion">
      <i class="bi bi-person-circle icono-premium"></i> Iniciar Sesión
    </h3>
    <form>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control"
        id="email"
        placeholder="usuario@correo.com"
        required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control"
        id="password"
        placeholder="********"
        required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Entrar
      </button>

      <div class="text-center mt-4 login-links">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <br>
        <a href="registro.html">Crear cuenta nueva</a>
      </div>
    </form>
  </div>
