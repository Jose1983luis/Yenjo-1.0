<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/premium.css">

</head>
<body>
<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
    <img src="../image/Logo Angelina.jpeg" width="75" height="55"
    class="me-2">
    ANGELINA ESTETICA
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link active" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container contenedor-premium d-flex align-items-center justify-content-center">
  <div class="login-card">
    <h3 class="titulo-seccion">
      <i class="bi bi-person-circle icono-premium"></i> Iniciar Sesión
    </h3>

<form id="formLogin">

  <!-- Mensajes de respuesta -->
  <div id="mensajeLogin" class="alert d-none" role="alert"></div>

  <div class="mb-3">
    <label for="email" class="form-label">Correo electrónico</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="correo"
      placeholder="usuario@correo.com"
      required>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input
      type="password"
      class="form-control"
      id="password"
      name="password"
      placeholder="********"
      required>
  </div>

  <button
    type="submit"
    class="btn btn-primary w-100"
    id="btnLogin">
    Entrar
  </button>

  <div class="text-center mt-4 login-links">
    <a href="#">¿Olvidaste tu contraseña?</a>
    <br>
    <a href="registro.html">Crear cuenta nueva</a>
  </div>

</form>

  </div>
</div>

<footer>
  <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Capa centralizada de comunicación con la API -->
<script src="../js/api.js"></script>

<!-- Integración del formulario de inicio de sesión -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    const formulario = document.getElementById('formLogin');
    const mensaje = document.getElementById('mensajeLogin');
    const botonLogin = document.getElementById('btnLogin');

    formulario.addEventListener('submit', async function (evento) {

        evento.preventDefault();

        if (!formulario.checkValidity()) {
            formulario.reportValidity();
            return;
        }

        const correo = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        botonLogin.disabled = true;
        botonLogin.textContent = 'Ingresando...';

        ocultarMensaje();

        try {

            const respuesta = await apiRequest('auth', {
                metodo: 'POST',
                parametros: {
                    accion: 'login'
                },
                datos: {
                    correo: correo,
                    password: password
                }
            });

            if (respuesta.estado === true) {

                const usuario = respuesta.datos;

                mostrarMensaje(
                    `Bienvenido ${usuario.nombre}. Rol: ${usuario.nombre_rol}.`,
                    'success'
                );

                console.log('Inicio de sesión correcto:', usuario);

                // Redirigir según el rol del usuario.
                const destinos = {
                    'Administrador': 'dashboard.html',
                    'Estilista': 'citas.html',
                    'Cliente': 'galeria.html'
                };

                const destino = destinos[usuario.nombre_rol];

                if (destino) {
                    setTimeout(() => {
                        window.location.href = destino;
                    }, 1200);
                } else {
                    mostrarMensaje(
                        'El rol del usuario no tiene una página de destino asignada.',
                        'danger'
                    );
                }

                }
                else {

                mostrarMensaje(
                    respuesta.mensaje || 'No fue posible iniciar sesión.',
                    'danger'
                );
            }

        } catch (error) {

            console.error('Error en el inicio de sesión:', error);

            mostrarMensaje(
                error.message || 'Ocurrió un error al iniciar sesión.',
                'danger'
            );

        } finally {

            botonLogin.disabled = false;
            botonLogin.textContent = 'Entrar';
        }
    });

    function mostrarMensaje(texto, tipo) {

        mensaje.textContent = texto;
        mensaje.className = `alert alert-${tipo}`;
        mensaje.classList.remove('d-none');
    }

    function ocultarMensaje() {

        mensaje.textContent = '';
        mensaje.className = 'alert d-none';
    }

});
</script>
</body>
</html>
