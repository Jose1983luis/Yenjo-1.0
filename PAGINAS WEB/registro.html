<h2 class="titulo-principal">
  <i class="bi bi-person-plus-fill"></i>
  Registro de Usuario
</h2>
  <div class="container contenedor-premium d-flex align-items-center justify-content-center">
    <div class="login-card">
      <h3 class="titulo-seccion text-center mb-4">
  Crear Nueva Cuenta
</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" placeholder="Pepito" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" placeholder="Pérez" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" placeholder="+57 300 000 0000" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" placeholder="********" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Confirmar Contraseña</label>
            <input type="password" class="form-control" placeholder="********" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrar</button>

        <div class="login-links text-center">
          <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </form>
    </div>
  </div>
