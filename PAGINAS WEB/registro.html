<h2 class="titulo-principal">
  <i class="bi bi-person-plus-fill"></i>
  Registro de Usuario
</h2>
  <div class="container contenedor-premium d-flex align-items-center justify-content-center">
    <div class="login-card">
      <h3 class="titulo-seccion text-center mb-4">
  Crear Nueva Cuenta
</h3>

<form id="formRegistro">

  <!-- Mensajes de respuesta -->
  <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="nombre" class="form-label">Nombres</label>
      <input
        type="text"
        class="form-control"
        id="nombre"
        name="nombre"
        placeholder="Pepito"
        required>
    </div>

    <div class="col-md-6 mb-3">
      <label for="apellido" class="form-label">Apellidos</label>
      <input
        type="text"
        class="form-control"
        id="apellido"
        name="apellido"
        placeholder="Pérez"
        required>
    </div>
  </div>

  <div class="mb-3">
    <label for="correo" class="form-label">Correo electrónico</label>
    <input
      type="email"
      class="form-control"
      id="correo"
      name="correo"
      placeholder="usuario@correo.com"
      required>
  </div>

  <div class="mb-3">
    <label for="telefono" class="form-label">Teléfono</label>
    <input
      type="tel"
      class="form-control"
      id="telefono"
      name="telefono"
      placeholder="+57 300 000 0000"
      required>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="********"
        required>
    </div>

    <div class="col-md-6 mb-3">
      <label for="confirmarPassword" class="form-label">
        Confirmar Contraseña
      </label>
      <input
        type="password"
        class="form-control"
        id="confirmarPassword"
        name="confirmarPassword"
        placeholder="********"
        required>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" id="btnRegistrar">
    Registrar
  </button>

  <div class="login-links text-center">
    <a href="login.html" class="text-decoration-none">
      ¿Ya tienes cuenta? Inicia sesión
    </a>
  </div>

</form>

    </div>
  </div>

<footer>
  <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<!-- Capa centralizada de comunicación con la API -->
<script src="../js/api.js"></script>

<!-- Integración del formulario de registro -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    const formulario = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensajeRegistro');
    const botonRegistrar = document.getElementById('btnRegistrar');

    formulario.addEventListener('submit', async function (evento) {

        evento.preventDefault();

        // Validar los campos del formulario.
        if (!formulario.checkValidity()) {
            formulario.reportValidity();
            return;
        }

        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        const correo = document.getElementById('correo').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const password = document.getElementById('password').value;
        const confirmarPassword = document.getElementById('confirmarPassword').value;

        // Validar que las contraseñas coincidan.
        if (password !== confirmarPassword) {
            mostrarMensaje('Las contraseñas no coinciden.', 'danger');
            return;
        }

        // Preparar los datos según el contrato del backend.
        const datosUsuario = {
            nombre: nombre,
            apellido: apellido,
            correo: correo,
            telefono: telefono,
            password: password
        };

        botonRegistrar.disabled = true;
        botonRegistrar.textContent = 'Registrando...';

        ocultarMensaje();

        try {

            const respuesta = await apiRequest('usuarios', {
                metodo: 'POST',
                datos: datosUsuario
            });

            if (respuesta.estado === true) {

                mostrarMensaje(
                    respuesta.mensaje || 'Usuario registrado correctamente.',
                    'success'
                );

                formulario.reset();

            } else {

                mostrarMensaje(
                    respuesta.mensaje || 'No fue posible completar el registro.',
                    'danger'
                );
            }

        } catch (error) {

            console.error('Error en el registro:', error);

            mostrarMensaje(
                error.message || 'Ocurrió un error al registrar el usuario.',
                'danger'
            );

        } finally {

            botonRegistrar.disabled = false;
            botonRegistrar.textContent = 'Registrar';
        }
    });

    function mostrarMensaje(texto, tipo) {

        mensaje.textContent = texto;
        mensaje.className = `alert alert-${tipo}`;
        mensaje.classList.remove('d-none');
    }

    function ocultarMensaje() {

        mensaje.textContent = '';
        mensaje.className = 'alert d-none';
    }

});
</script>

</body>
</html>
