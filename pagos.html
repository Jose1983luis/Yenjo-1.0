<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Pagos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">YENJO 1.0</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html">Cerrar Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>


  <!-- Contenedor principal -->
  <div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
      <h3 class="text-center mb-4">Métodos de Pago</h3>
      <p class="text-center text-muted">Selecciona tu método de pago preferido para finalizar la reserva del servicio.</p>

      <form>
        <!-- Opciones de pago -->
        <div class="mb-3">
          <div class="form-check border rounded p-3 mb-2">
            <input class="form-check-input" type="radio" name="metodoPago" id="nequi">
            <label class="form-check-label" for="nequi">
              <strong>Nequi</strong> – Pago rápido desde tu celular.
            </label>
          </div>

          <div class="form-check border rounded p-3 mb-2">
            <input class="form-check-input" type="radio" name="metodoPago" id="daviplata">
            <label class="form-check-label" for="daviplata">
              <strong>Daviplata</strong> – Transfiere de forma segura.
            </label>
          </div>

          <div class="form-check border rounded p-3 mb-2">
            <input class="form-check-input" type="radio" name="metodoPago" id="pse">
            <label class="form-check-label" for="pse">
              <strong>PSE</strong> – Pago en línea con tu banco.
            </label>
          </div>

          <div class="form-check border rounded p-3">
            <input class="form-check-input" type="radio" name="metodoPago" id="efectivo">
            <label class="form-check-label" for="efectivo">
              <strong>Efectivo</strong> – Paga al momento del servicio.
            </label>
          </div>
        </div>

        <!-- Botón confirmar -->
        <button type="submit" class="btn btn-success w-100 mt-3">Confirmar Pago</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-muted mt-4 mb-3">
    <small>&copy; 2025 YENJO 1.0 - Nails Artistry & Beauty</small>
  </footer>
</body>
</html>
