<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Pagos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>

body {
  background: linear-gradient(
    to bottom,
    #111111 0%,
    #0a0a0a 40%,
    #000000 100%
  );
  color: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  background-color: #111111 !important;
  border-bottom: 1px solid #d4af37;
}

.navbar-brand{
    color: #d4af37 !important;
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-link{
    color: white !important;
    transition: 0.3s;
}

.nav-link:hover{
    color: #d4af37 !important;
}

/* LOGO */
.navbar-brand img{
    border-radius: 50%;
    border: 2px solid #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

/* CARD PRINCIPAL */
.card{
    background-color: #f8f8f8;
    border: 2px solid #d4af37;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(212,175,55,0.25);
}
/* TITULOS */
h3{
    color: #5b6c84;
    font-weight: bold;
}

/* TEXTO */
.text-muted{
    color: #777 !important;
}

/* OPCIONES DE PAGO */
.form-check{
    background-color: #1f1f1f;
    border: 3px solid #d4af37 !important;
    border-radius: 12px;
    transition: 0.3s;
}

.form-check:hover{
    transform: scale(1.01);
    box-shadow: 0 0 10px rgba(212,175,55,0.2);
}

.form-check-label{
    color: white;
}

.form-check-input{
    background-color: #111;
    border: 1px solid #d4af37;
}

.form-check-input:checked{
    background-color: #d4af37;
    border-color: #d4af37;
}

/* BOTON */
.btn-success{
    background-color: #d4af37;
    border: none;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

.btn-success:hover{
    background-color: #b8932f;
    transform: translateY(-2px);
}

/* FOOTER */
footer{
    color: #d4af37 !important;
}

/* TITULO SUPERIOR */
.titulo-pagos{
    color: #d4af37;
    text-align: center;
    margin-top: 30px;
    margin-bottom: 30px;
    font-family: 'Cinzel', serif;
    font-weight: bold;
}
footer{
    color: #d4af37;
    text-align: center;
}
</style>
</head>
<body>
  <!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
  <img src="image/Logo Angelina.jpeg" width="75" height="55"
  class="me-3 rounded-circle border border-warning shadow"
  style="border-width: 2px !important;">
  ANGELINA ESTETICA
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>


  <!-- Contenedor principal -->
   <h2 class="titulo-pagos">
  <i class="bi bi-credit-card-2-front-fill"></i>
  Métodos de Pago
</h2>
  <div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
      <h3 class="text-center mb-4">
  Selecciona tu Método de Pago
</h3>
      <p class="text-center text-muted">Selecciona tu método de pago preferido para finalizar la reserva del servicio.</p>

      <form>
        <!-- Opciones de pago -->
        <div class="mb-3">

  <!-- Nequi -->
  <div class="form-check p-3 mb-3 d-flex align-items-center">
    <input class="form-check-input me-3" type="radio" name="metodoPago" id="nequi">

    <i class="bi bi-phone-fill text-warning fs-4 me-3"></i>

    <label class="form-check-label" for="nequi">
      <strong>Nequi</strong> – Pago rápido desde tu celular.
    </label>
  </div>

  <!-- Daviplata -->
  <div class="form-check p-3 mb-3 d-flex align-items-center">
    <input class="form-check-input me-3" type="radio" name="metodoPago" id="daviplata">

    <i class="bi bi-wallet2 text-warning fs-4 me-3"></i>

    <label class="form-check-label" for="daviplata">
      <strong>Daviplata</strong> – Transfiere de forma segura.
    </label>
  </div>

  <!-- PSE -->
  <div class="form-check p-3 mb-3 d-flex align-items-center">
    <input class="form-check-input me-3" type="radio" name="metodoPago" id="pse">

    <i class="bi bi-bank text-warning fs-4 me-3"></i>

    <label class="form-check-label" for="pse">
      <strong>PSE</strong> – Pago en línea con tu banco.
    </label>
  </div>

  <!-- Efectivo -->
  <div class="form-check p-3 d-flex align-items-center">
    <input class="form-check-input me-3" type="radio" name="metodoPago" id="efectivo">

    <i class="bi bi-cash-coin text-warning fs-4 me-3"></i>

    <label class="form-check-label" for="efectivo">
      <strong>Efectivo</strong> – Paga al momento del servicio.
    </label>
  </div>

</div>

        <!-- Botón confirmar -->
        <button type="submit" class="btn btn-success w-100 mt-3">Confirmar Pago</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-5 mb-3 w-100">
    <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>
</body>
</html>
