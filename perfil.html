<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Perfil del Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>

body {
    scroll-behavior: smooth;

    background:
    radial-gradient(circle at top, rgba(212,175,55,0.04), transparent 30%),
    linear-gradient(to bottom, #121212, #0a0a0a);

    color: #f5f5f5;
    font-family: 'Segoe UI', sans-serif;

    min-height: 100vh;
}

/* NAVBAR */
.navbar {
    background: rgba(17,17,17,0.90) !important;

    border-bottom: 1px solid #d4af37;

    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);

    box-shadow: 0 0 20px rgba(0,0,0,0.35);

    transition: all 0.4s ease;

    animation: navbarFade 0.8s ease;
}

.navbar-brand{
    color: #d4af37 !important;
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-link {
    position: relative;

    color: #f5f5f5 !important;

    transition: all 0.3s ease;
}

.nav-link:hover {
    color: #d4af37 !important;
}

.nav-link::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -4px;

    width: 0;
    height: 2px;

    background: #d4af37;

    transition: width 0.3s ease;
}

.nav-link:hover::after {
    width: 100%;
}

/* LOGO */
.navbar-brand img {
    border-radius: 50%;
    border: 1px solid #d4af37;

    box-shadow: 0 0 15px rgba(212,175,55,0.6);

    transition: all 0.4s ease;
}

.navbar-brand:hover img {
    transform: scale(1.08) rotate(3deg);

    box-shadow:
      0 0 20px rgba(212,175,55,0.6),
      0 0 35px rgba(212,175,55,0.3);
}
/* CARD PERFIL */
.card{
    opacity: 0;

    position: relative;
    z-index: 1;

    cursor: pointer;

    background: rgba(27,27,27,0.75);

    border: 1px solid rgba(212,175,55,0.25);

    border-radius: 20px;

    overflow: hidden;

    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);

    box-shadow:
        0 0 15px rgba(0,0,0,0.4),
        0 0 10px rgba(212,175,55,0.08);

    transition: all 0.4s ease;

    animation: fadeUp 0.8s ease both;
}
.card:hover{
    transform: translate3d(0, -8px, 0) scale(1.02);

    border-color: rgba(212,175,55,0.6);

    box-shadow:
        0 0 25px rgba(212,175,55,0.18),
        0 0 40px rgba(212,175,55,0.10);
}

/* TITULO */
.titulo-seccion {
    color: #d4af37;
    font-weight: 700;

    text-shadow:
        0 0 10px rgba(212,175,55,0.20);
}

/* LABELS */
.form-label{
    color: #d4af37;
    font-weight: 600;
}

/* INPUTS */
.form-control{
    background: rgba(255,255,255,0.04);

    border: 1px solid rgba(212,175,55,0.25);

    color: white;

    border-radius: 12px;

    transition: all 0.3s ease;
}

.form-control:focus{

    background: rgba(255,255,255,0.08);

    color: white;

    border-color: #d4af37;

    box-shadow:
        0 0 15px rgba(212,175,55,0.25);

    transform: scale(1.01);
}

/* BOTÓN PREMIUM */
.btn-primary{
    position: relative;
    overflow: hidden;

    background: linear-gradient(90deg,#c79a1b,#d4af37,#f3d46b,#d4af37,#c79a1b);
    border: none;
    color: #111;
    font-weight: bold;

    transition: .35s ease;
}

.btn-primary:hover{
    background: linear-gradient(90deg,#c79a1b,#d4af37,#f3d46b,#d4af37,#c79a1b);
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(212,175,55,.45);
}
/* DESTELLO */
.btn-primary::before{
    content: "";
    position: absolute;
    top: 0;
    left: -150%;

    width: 35%;
    height: 100%;

    background: rgba(255,255,255,.7);

    transform: skewX(-25deg);

    transition: .7s;
}

.btn-primary:hover::before{
    left: 160%;
}

/* ELIMINA EL AZUL DE BOOTSTRAP */
.btn-primary:focus,
.btn-primary:active,
.btn-primary:focus-visible{
    background-color:#d4af37 !important;
    border:none !important;
    color:black !important;
    outline:none !important;
    box-shadow:none !important;
}

/* FOOTER */
footer{
    color: #d4af37;
    text-align: center;
}
.footer-premium{
    margin-top:80px;
    padding:20px 0;
    color:rgba(212,175,55,.75);
    font-size:.9rem;
    text-align:center;
}
/* TITULO SUPERIOR */
.titulo-principal {
    color: #d4af37;
    text-align: center;
    margin-top: 30px;
    margin-bottom: 30px;
    font-family: 'Cinzel', serif;
    font-weight: bold;
}
@keyframes navbarFade {
    from {
        opacity: 0;
        transform: translateY(-25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.container{
margin-top:40px;
}

</style>
</head>
<body>
  <!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
   <img
   src="image/Logo Angelina.jpeg"
   alt="Logo Angelina Estética"
   width="75"
   height="55"
   class="me-2">
   ANGELINA ESTETICA
   </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

<h2 class="titulo-principal text-center">
  <i class="bi bi-person-circle"></i>
  Perfil del Usuario
</h2>
  <div class="container">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
      <h3 class="titulo-seccion text-center">
  Información Personal
</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" value="Pepito" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" value="Pérez" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" value="pepito@correo.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" value="+57 300 000 0000" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input type="text" class="form-control" value="Calle 123 #45-67" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Modificar</button>
      </form>
    </div>
  </div>
  <footer class="footer-premium">
  <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>
</body>
</html>
