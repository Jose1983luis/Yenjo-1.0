<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENJO 1.0 - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>

body {
  background: linear-gradient(
    to bottom,
    #111111 0%,
    #0a0a0a 40%,
    #000000 100%
  );
  color: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
}
/* NAVBAR */
.navbar {
  background-color: #111111 !important;
  border-bottom: 1px solid #d4af37;
}

.navbar-brand{
    color: #d4af37 !important;
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-link{
    color: white !important;
    transition: 0.3s;
}

.nav-link:hover{
    color: #d4af37 !important;
}

/* LOGO */
.navbar-brand img{
    border-radius: 50%;
    border: 2px solid #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.7);
}

/* CARD */
.card{
    background-color: #f5f5f5;
    border: 2px solid #d4af37;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(212,175,55,0.20);
}

/* TITULOS */
h3{
    color: #5b6c84;
    font-weight: bold;
}

/* LABELS */
.form-label{
    color: #d4af37;
    font-weight: 600;
}

/* INPUTS */
.form-control{
    background-color: #1f1f1f;
    border: 1px solid #d4af37;
    color: white;
}

.form-control::placeholder{
    color: #999;
}

.form-control:focus{
    background-color: #1f1f1f;
    color: white;
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212,175,55,0.4);
}

/* BOTON */
.btn-success{
    background-color: #d4af37;
    border: none;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

.btn-success:hover{
    background-color: #b8932f;
    transform: translateY(-2px);
}

/* LINKS */
a{
    color: #d4af37;
}

a:hover{
    color: #f1cf63;
}

/* FOOTER */
footer{
    color: #d4af37;
    text-align: center;
}

/* TITULO SUPERIOR */
.titulo-registro{
    color: #d4af37;
    text-align: center;
    margin-top: 30px;
    margin-bottom: 30px;
    font-family: 'Cinzel', serif;
    font-weight: bold;
}

</style>
</head>
<body>
  <!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="galeria.html">
  <img src="image/Logo Angelina.jpeg" width="75" height="55"
  class="me-3 rounded-circle border border-warning"
  style="border-width: 2px !important; box-shadow: 0 0 15px rgba(212,175,55,0.7);">
  ANGELINA ESTETICA
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="galeria.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Inicio de Sesión</a></li>
      </ul>
    </div>
  </div>
</nav>
<h2 class="titulo-registro">
  <i class="bi bi-person-plus-fill"></i>
  Registro de Usuario
</h2>
  <div class="container d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="max-width: 500px;">
      <h3 class="text-center mb-4">
  Crear Nueva Cuenta
</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" placeholder="Pepito" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" placeholder="Pérez" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" placeholder="+57 300 000 0000" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" placeholder="********" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Confirmar Contraseña</label>
            <input type="password" class="form-control" placeholder="********" required>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 mb-3">Registrar</button>

        <div class="text-center">
          <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </form>
    </div>
  </div>
<footer class="mt-5 mb-3">
  <small>&copy; 2025 YENJO 1.0 - Soluciones Joyecaemm</small>
</footer>
</body>
</html>
